<html lang="en"><head><meta charset="utf-8">

<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#060b16;color:#dbe7f5;font:16px/1.5 system-ui,-apple-system,sans-serif;padding:24px;text-align:center}

<body><div class="c"><h1>JARVIS is offline</h1>
<p>The app files have not been saved on this device yet, so JARVIS cannot start without a connection.</p>
<p>Connect to the internet and open JARVIS once. After that it can start offline. Your saved business data is kept in this browser on this device and is not lost.</p>
<button onclick="location.reload()">Try again</button></div></body></html>
